<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070d"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ULTIMATE ME</title>
<style>
:root{--bg:#05070d;--p:#0b1020;--p2:#11182b;--l:#263452;--t:#eef4ff;--m:#8290ad;--c:#55e6ff;--v:#9b6cff;--g:#ffd76a;--gr:#66f2a1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18244a,#080b14 42%,#03050a);color:var(--t);font-family:system-ui,sans-serif}.app{max-width:950px;margin:auto;padding:18px 14px 80px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:2px}.sub,.muted{color:var(--m);font-size:10px;letter-spacing:1px}.reset{background:#0c1220;color:#9ba9c6;border:1px solid #33415e;border-radius:10px;padding:8px}.hero,.card{background:#0b1020e8;border:1px solid #243454;border-radius:20px;padding:17px;margin:12px 0}.heroGrid{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}.core{width:170px;height:170px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--aura)*1%),#1b2946 0);box-shadow:0 0 35px #55e6ff30}.coreIn{text-align:center;background:#070b15;border-radius:50%;width:132px;height:132px;padding-top:32px}.aura{font-size:38px;font-weight:900}.label{font-size:9px;letter-spacing:3px;color:var(--m)}.level{color:var(--c);font-size:12px;letter-spacing:3px;font-weight:800}.lvl{font-size:48px;font-weight:950}.title{color:#aeb9d0;margin-bottom:14px}.bar,.xpbar{height:9px;background:#17223a;border-radius:99px;overflow:hidden}.fill,.xpfill{height:100%;background:linear-gradient(90deg,var(--c),var(--v));border-radius:99px}.xptext{display:flex;justify-content:space-between;color:var(--m);font-size:10px;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#0b1120;border:1px solid #1d2a45;border-radius:14px;padding:12px}.stat b{font-size:21px}.stat span{display:block;color:var(--m);font-size:9px;margin-top:3px}.tabs{display:flex;gap:7px;margin:14px 0}.tab{flex:1;background:#0a0f1c;border:1px solid #202e49;color:#7e8da9;border-radius:12px;padding:11px;font-weight:800}.tab.active{color:white;border-color:#49628e;background:#121a2e}.card h2{font-size:13px;letter-spacing:1px}.quest{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #17223a}.quest:last-of-type{border:0}.check{width:23px;height:23px;accent-color:var(--c)}.qname{font-weight:750}.done .qname{text-decoration:line-through;color:#64718b}.meta{font-size:9px;color:var(--m);margin-top:3px}.reward{margin-left:auto;color:var(--g);font-weight:800;font-size:11px}form{display:grid;grid-template-columns:1fr 110px auto;gap:7px;margin-top:10px}input,select{width:100%;background:#080d18;color:white;border:1px solid #263653;border-radius:10px;padding:10px}.add{background:linear-gradient(90deg,#38cfe9,#8262ef);border:0;color:white;font-weight:900;border-radius:10px;padding:0 15px}.attr{margin:10px 0}.attrhead{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.badge{border:1px solid #273553;background:#0c1323;border-radius:13px;padding:12px;text-align:center;opacity:.35}.badge.unlocked{opacity:1}.badge b{display:block;font-size:21px}.badge span{font-size:9px;color:#9ba8c0}.milestone{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #17223a}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#121c31;border:1px solid #344565;font-weight:900}.reached .dot{border-color:var(--gr);color:var(--gr)}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,30px);background:#111c32;border:1px solid #4c6b9d;padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;font-weight:800}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.heroGrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr 1fr}.add{height:40px}.badges{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">ULTIMATE ME</div><div class="sub">OFFLINE QUEST SYSTEM // V3</div></div><button class="reset" onclick="resetAll()">RESET</button></header>
<section class="hero"><div class="heroGrid"><div class="core" id="core"><div class="coreIn"><div class="label">DAILY AURA</div><div class="aura" id="aura">0</div><div class="label">/ 100</div></div></div><div><div class="level">CURRENT RANK</div><div class="lvl" id="level">LVL 1</div><div class="title" id="title">THE BEGINNING</div><div class="xpbar"><div class="xpfill" id="xpfill"></div></div><div class="xptext"><span id="xptext">0 XP</span><span>ULTIMATE ME · LVL 100</span></div></div></div></section>
<div class="stats"><div class="stat"><b id="completion">0%</b><span>COMPLETION</span></div><div class="stat"><b id="streak">0</b><span>DAY STREAK</span></div><div class="stat"><b id="done">0</b><span>QUESTS DONE</span></div><div class="stat"><b id="total">0</b><span>TOTAL QUESTS</span></div></div>
<div class="tabs"><button class="tab active" onclick="showTab('today',this)">TODAY</button><button class="tab" onclick="showTab('week',this)">WEEK</button><button class="tab" onclick="showTab('journey',this)">JOURNEY</button></div><main id="content"></main></div><div class="toast" id="toast"></div>
<script>
const K='ultimate_me_v2';let s=JSON.parse(localStorage.getItem(K)||'null')||{quests:[],xp:0,done:0,streak:0,lastDate:null,attrs:{STR:0,VIT:0,FOC:0,DIS:0}};
const today=()=>new Date().toISOString().slice(0,10),save=()=>{localStorage.setItem(K,JSON.stringify(s));render('today')};
function reward(d,t){let a={Easy:5,Normal:10,Hard:20,Epic:35}[d]||10;return t==='weekly'?a*2:a}
function addQuest(t){let n=document.getElementById(t+'Name').value.trim(),d=document.getElementById(t+'Diff').value;if(!n)return;s.quests.push({id:Date.now(),name:n,diff:d,type:t,created:today(),done:false});document.getElementById(t+'Name').value='';save();toast('QUEST ACCEPTED')}
function complete(id){let q=s.quests.find(x=>x.id===id);if(!q||q.done)return;q.done=true;let r=reward(q.diff,q.type);s.xp+=r;s.done++;if(s.lastDate!==today()){s.streak++;s.lastDate=today()}save();toast('QUEST COMPLETE  +'+r+' AURA')}
function level(){return Math.min(100,Math.floor(s.xp/100)+1)}function title(l){return l===100?'ULTIMATE ME':l>=75?'FINAL FORM':l>=50?'ASCENSION':l>=25?'DISCIPLINE':l>=10?'AWAKENING':'THE BEGINNING'}
function showTab(t,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(t)}
function qhtml(q){return `<div class="quest ${q.done?'done':''}"><input class="check" type="checkbox" ${q.done?'checked':''} onchange="complete(${q.id})"><div><div class="qname">${esc(q.name)}</div><div class="meta">${q.diff.toUpperCase()} · ${q.type.toUpperCase()}</div></div><div class="reward">+${reward(q.diff,q.type)} AURA</div></div>`}
function form(t){return `<form onsubmit="event.preventDefault();addQuest('${t}')"><input id="${t}Name" placeholder="New ${t} quest..."><select id="${t}Diff"><option>Easy</option><option>Normal</option><option>Hard</option><option>Epic</option></select><button class="add">ADD</button></form>`}
function attrs(){return [['STR','STRENGTH'],['VIT','VITALITY'],['FOC','FOCUS'],['DIS','DISCIPLINE']].map(a=>`<div class="attr"><div class="attrhead"><span>${a[1]}</span><b>${s.attrs[a[0]]}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,s.attrs[a[0]])}%"></div></div></div>`).join('')}
function badges(){let b=[['⚡','FIRST QUEST',s.done>=1],['🔥','7 QUESTS',s.done>=7],['💠','50 QUESTS',s.done>=50],['👑','LEVEL 10',level()>=10],['🌌','LEVEL 50',level()>=50],['∞','ULTIMATE ME',level()>=100]];return '<div class="badges">'+b.map(x=>`<div class="badge ${x[2]?'unlocked':''}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div>'}
function journey(){return [1,5,10,25,50,75,100].map(x=>`<div class="milestone ${level()>=x?'reached':''}"><div class="dot">${level()>=x?'✓':x}</div><div><b>LEVEL ${x}</b><div class="muted">${x===100?'ULTIMATE ME':'Evolution milestone'}</div></div></div>`).join('')}
function render(tab='today'){let d=s.quests.filter(q=>q.type==='daily'&&q.created===today()),w=s.quests.filter(q=>q.type==='weekly'),dd=d.filter(q=>q.done).length,a=d.reduce((x,q)=>x+(q.done?reward(q.diff,q.type):0),0),l=level();document.getElementById('aura').textContent=Math.min(100,a);document.getElementById('core').style.setProperty('--aura',Math.min(100,a));document.getElementById('level').textContent='LVL '+l;document.getElementById('title').textContent=title(l);document.getElementById('xpfill').style.width=(l===100?100:s.xp%100)+'%';document.getElementById('xptext').textContent=s.xp+' XP';document.getElementById('completion').textContent=(d.length?Math.round(dd/d.length*100):0)+'%';document.getElementById('streak').textContent=s.streak;document.getElementById('done').textContent=s.done;document.getElementById('total').textContent=s.quests.length;
let c=document.getElementById('content');if(tab==='today')c.innerHTML=`<section class="card"><div class="row"><h2>⚔ DAILY MISSIONS</h2><span class="muted">${dd}/${d.length}</span></div>${d.length?d.map(qhtml).join(''):'<div class="muted">No missions yet. Create your first quest.</div>'}${form('daily')}</section><section class="card"><h2>🧬 ATTRIBUTES</h2>${attrs()}</section>`;else if(tab==='week')c.innerHTML=`<section class="card"><div class="row"><h2>🔥 WEEKLY BOSS QUESTS</h2><span class="muted">${w.filter(q=>q.done).length}/${w.length}</span></div>${w.length?w.map(qhtml).join(''):'<div class="muted">Set a bigger target for this week.</div>'}${form('weekly')}</section><section class="card"><h2>🏆 ACHIEVEMENTS</h2>${badges()}</section>`;else c.innerHTML=`<section class="card"><h2>👑 THE JOURNEY</h2><div class="row"><div><div class="level">DESTINATION</div><div style="font-size:28px;font-weight:900">LEVEL 100</div><div class="muted">ULTIMATE ME</div></div><b style="font-size:22px">${Math.min(100,Math.floor(s.xp/99))}%</b></div><div class="bar" style="margin-top:14px"><div class="fill" style="width:${Math.min(100,s.xp/99)}%"></div></div>${journey()}</section>`}
function esc(x){return x.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}function resetAll(){if(confirm('Reset all progress?')){localStorage.removeItem(K);location.reload()}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
